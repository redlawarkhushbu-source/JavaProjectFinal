server.port=8080

# Spring Application Name
spring.application.name=shet-samarthan-backend

# ===================================================================
# Database Configuration: PostgreSQL (with Hibernate JPA)
# ===================================================================
# Primary: PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shetsamarthandb}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# In-Memory H2 Fallback (Uncomment for standalone dev testing if PostgreSQL is offline):
# spring.datasource.url=jdbc:h2:mem:shetsamarthandb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# ===================================================================
# Third-Party Integrations
# ===================================================================
# 1. OpenWeatherMap API
openweathermap.api.key=${OPENWEATHERMAP_API_KEY:demo_key}
openweathermap.api.base-url=https://api.openweathermap.org/data/2.5

# 2. DeepLearning4J (DL4J) Configuration
dl4j.crop.model.name=ShetSamarthan-DeepCnnBotanicalNet-v1
dl4j.crop.min-confidence=0.70

# 3. Kindwise crop.health Official API Configuration (Primary Diagnosis Engine)
kindwise.api.key=${KINDWISE_API_KEY:}
kindwise.api.url=${KINDWISE_API_URL:https://crop.kindwise.com/api/v1/identification}

# 4. OpenRouter Assistant Configuration (Primary AI Brain)
openrouter.api.key=${OPENROUTER_API_KEY:}
openrouter.model=${OPENROUTER_MODEL:meta-llama/llama-3.3-70b-instruct}

# 5. Sarvam AI Text-to-Speech Configuration
sarvam.api.key=${SARVAM_API_KEY:}



# Security JWT Secret
jwt.secret=ShetSamarthanSecretKeyForJwtTokenGeneration2026MaharashtraSmartAgriPlatform
jwt.expiration=86400000

# File Upload Limit for Leaf Images
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
